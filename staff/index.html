<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>موظفو التوصيل | قطرة نقية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --line: rgba(148, 163, 184, 0.22);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #06b6d4;
      --ok: #10b981;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0b1220, #111827 40%, #0f172a);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .brand { font-weight: 900; font-size: 1.15rem; color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800;
      cursor: pointer; text-decoration: none; font-size: 0.95rem;
    }
    .btn-primary { background: linear-gradient(135deg, #06b6d4, #2563eb); color: #fff; width: 100%; }
    .btn-ok { background: var(--ok); color: #052e1a; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn-maps { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.35); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .order-head {
      display: flex; justify-content: space-between; gap: 8px; align-items: flex-start;
      margin-bottom: 8px;
    }
    .order-num { font-weight: 900; color: #67e8f9; letter-spacing: 0.02em; }
    .badge {
      font-size: 0.75rem; font-weight: 800; padding: 4px 8px; border-radius: 999px;
      background: rgba(245, 158, 11, 0.15); color: #fcd34d;
    }
    .row { margin: 6px 0; font-size: 0.92rem; }
    .row strong { color: #cbd5e1; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #0f172a; border: 1px solid var(--line); color: var(--text);
      padding: 10px 16px; border-radius: 999px; font-size: 0.9rem; z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand"><i class="fas fa-truck"></i> موظفو التوصيل</div>
      <button type="button" id="logoutBtn" class="btn btn-ghost hidden">خروج</button>
    </div>

    <section id="loginView" class="card">
      <h2 style="margin:0 0 8px;font-size:1.1rem">تسجيل دخول الموظف</h2>
      <p class="muted" style="margin-top:0">طلبات اليوم فقط: رقم العميل + الموقع + تم التسليم. بلا حذف أو إلغاء.</p>
      <label for="username">اسم المستخدم</label>
      <input id="username" autocomplete="username" />
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button type="button" id="loginBtn" class="btn btn-primary">دخول</button>
      <p id="loginError" class="muted" style="color:#fca5a5;margin-top:10px"></p>
    </section>

    <section id="ordersView" class="hidden">
      <div class="top" style="margin-bottom:10px">
        <div class="muted" id="staffHello">مرحباً</div>
        <button type="button" id="refreshBtn" class="btn btn-ghost"><i class="fas fa-sync"></i> تحديث</button>
      </div>
      <div id="ordersList"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const TOKEN_KEY = 'puredrop_staff_token';
    const API = '/api/staff';

    function $(id) { return document.getElementById(id); }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function showToast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add('hidden'), 2800);
    }
    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(t) {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    }

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      const token = getToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(`${API}${path}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || 'طلب فاشل');
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function showLogin() {
      $('loginView').classList.remove('hidden');
      $('ordersView').classList.add('hidden');
      $('logoutBtn').classList.add('hidden');
    }
    function showOrders() {
      $('loginView').classList.add('hidden');
      $('ordersView').classList.remove('hidden');
      $('logoutBtn').classList.remove('hidden');
    }

    function renderOrders(orders) {
      const root = $('ordersList');
      if (!orders.length) {
        root.innerHTML = '<div class="card empty">لا توجد طلبات جديدة اليوم بانتظار التسليم</div>';
        return;
      }
      root.innerHTML = orders.map((o) => `
        <article class="card" data-id="${o.id}">
          <div class="order-head">
            <div class="order-num">${escapeHtml(o.orderNumber)}</div>
            <span class="badge">${escapeHtml(o.statusLabel || o.status)}</span>
          </div>
          <div class="row"><strong>العميل:</strong> ${escapeHtml(o.customerName || '—')}</div>
          <div class="row"><strong>الهاتف:</strong> <a href="tel:${escapeHtml(o.customerPhone || '')}" style="color:#67e8f9">${escapeHtml(o.customerPhone || '—')}</a></div>
          <div class="row"><strong>العنوان:</strong> ${escapeHtml(o.customerAddress || '—')}</div>
          <div class="row"><strong>المحتوى:</strong> ${escapeHtml(o.itemsSummary || (o.itemsCount + ' صنف'))}</div>
          <div class="row"><strong>الإجمالي:</strong> ${escapeHtml(String(o.total ?? '—'))} ${escapeHtml(o.currency || 'JOD')}</div>
          <div class="actions">
            ${o.mapsUrl ? `<a class="btn btn-maps" href="${escapeHtml(o.mapsUrl)}" target="_blank" rel="noopener"><i class="fas fa-map-marker-alt"></i> موقع العميل</a>` : '<span class="muted">لا يوجد موقع GPS</span>'}
            <button type="button" class="btn btn-ok" data-deliver="${o.id}"><i class="fas fa-check"></i> تم التسليم</button>
          </div>
        </article>
      `).join('');

      root.querySelectorAll('[data-deliver]').forEach((btn) => {
        btn.addEventListener('click', () => markDelivered(Number(btn.getAttribute('data-deliver')), btn));
      });
    }

    async function loadOrders() {
      const data = await api('/orders?active=1');
      renderOrders(data.orders || []);
    }

    async function markDelivered(id, btn) {
      if (!confirm('تأكيد: تم تسليم هذا الطلب للعميل؟')) return;
      btn.disabled = true;
      try {
        const data = await api(`/orders/${id}/deliver`, { method: 'POST', body: '{}' });
        let msg = 'تم تعليم الطلب كمُسلَّم';
        const sms = data.smsResult;
        if (sms?.ok && !sms.skipped) msg += ' — تم إرسال SMS';
        else if (sms?.skipped || sms?.ok === false) {
          msg += sms.provider === 'log' || !sms.provider
            ? ' — SMS غير مفعّل على السيرفر'
            : ` — SMS: ${sms.reason || 'لم يُرسل'}`;
        }
        showToast(msg);
        await loadOrders();
      } catch (e) {
        showToast(e.message || 'فشل التحديث');
        btn.disabled = false;
      }
    }

    async function doLogin() {
      $('loginError').textContent = '';
      try {
        const data = await api('/login', {
          method: 'POST',
          body: JSON.stringify({
            username: $('username').value.trim(),
            password: $('password').value
          })
        });
        setToken(data.token);
        $('staffHello').textContent = `مرحباً، ${data.staff?.username || 'موظف'}`;
        showOrders();
        await loadOrders();
      } catch (e) {
        $('loginError').textContent = e.message || 'فشل الدخول';
      }
    }

    $('loginBtn').addEventListener('click', doLogin);
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    $('refreshBtn').addEventListener('click', () => loadOrders().catch((e) => showToast(e.message)));
    $('logoutBtn').addEventListener('click', () => {
      setToken('');
      showLogin();
    });

    (async function init() {
      if (!getToken()) {
        showLogin();
        return;
      }
      try {
        const me = await api('/me');
        $('staffHello').textContent = `مرحباً، ${me.staff?.username || 'موظف'}`;
        showOrders();
        await loadOrders();
      } catch {
        setToken('');
        showLogin();
      }
    })();
  </script>
</body>
</html>
